name: Temporary export approved mockup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-approved-mockup.yml'
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload approved mockup
        uses: actions/upload-artifact@v4
        with:
          name: approved-mockup
          path: '_robocze/assets/images/Nieprzypadkowy Czytelnik_ Odkrywaj dobre książki_zaakceptowana.png'
          if-no-files-found: error
          retention-days: 1
