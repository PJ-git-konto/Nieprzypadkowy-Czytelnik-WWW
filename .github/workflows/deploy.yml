name: Diagnose OVH SFTP target

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect SFTP directory visibility
    runs-on: ubuntu-latest
    steps:
      - name: Validate connection settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Install SFTP password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: List remote SFTP directories
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$FTP_PASSWORD"
          printf 'pwd\nls -la\nls -la /\nls -la public_html\nls -la /public_html\n' |
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=accept-new \
              -P 22 \
              -b - \
              "$FTP_USERNAME@$FTP_SERVER"
