name: Deploy WordPress theme to OVH test

on:
  push:
    branches:
      - main
    paths:
      - 'theme/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload theme files via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_THEME_TARGET_DIR: ${{ secrets.FTP_THEME_TARGET_DIR }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_THEME_TARGET_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Install SFTP password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Deploy theme to OVH test
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_THEME_TARGET_DIR: ${{ secrets.FTP_THEME_TARGET_DIR }}
        run: |
          set -euo pipefail
          export SSHPASS="$FTP_PASSWORD"

          # Change directory on the SFTP server first, then upload into that
          # already-existing directory. This avoids passing the destination
          # path as the target argument to the SFTP put command.
          printf 'cd "%s"\nput -r theme/*\n' "$FTP_THEME_TARGET_DIR" |
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=accept-new \
              -P 22 \
              -b - \
              "$FTP_USERNAME@$FTP_SERVER"
